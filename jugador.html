<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div class="layout">
  <nav class="sidebar">

    <select id="lang-selector" class="lang-selector">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
      <option value="nl">Nederlands</option>
      <option value="sv">Svenska</option>
      <option value="no">Norsk</option>
      <option value="da">Dansk</option>
      <option value="pl">Polski</option>
      <option value="ru">Русский</option>
      <option value="af">Afrikaans</option>
      <option value="ja">日本語</option>
      <option value="zh">中文（简体）</option>
      <option value="ko">한국어</option>
      <option value="uk">Українська</option>
      <option value="ary">الدارجة المغربية</option>
      <option value="ar">العربية</option>
    </select>
    <a href="app.html" class="sidebar-link">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9h5v-5h2v5h5v-9"/></svg></span>
      <span data-i18n="sidebar.inicio">Inicio</span>
    </a>
    <a href="partido.html" class="sidebar-link">
      <span class="sidebar-icon accent-partido-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg></span>
      <span data-i18n="sidebar.nuevoPartido">Nuevo Partido</span>
    </a>
    <a href="jugador.html" class="sidebar-link active">
      <span class="sidebar-icon accent-jugador-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-4 4-6 7-6s5.5 2 7 6"/></svg></span>
      <span data-i18n="sidebar.nuevoJugador">Nuevo Jugador</span>
    </a>
    <a href="partidos.html" class="sidebar-link">
      <span class="sidebar-icon accent-partidos-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="17" x2="19" y2="17"/></svg></span>
      <span data-i18n="sidebar.misPartidos">Mis Partidos</span>
    </a>
    <a href="jugadores.html" class="sidebar-link">
      <span class="sidebar-icon accent-jugadores-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M3.5 19c1-3.2 3-5 5.5-5s4.5 1.8 5.5 5"/><path d="M14 14.3c2 .2 3.6 1.8 4.5 4.7"/></svg></span>
      <span data-i18n="sidebar.misJugadores">Mis Jugadores</span>
    </a>
    <a href="calendario.html" class="sidebar-link">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><line x1="4" y1="9" x2="20" y2="9"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span>
      <span data-i18n="sidebar.calendario">Calendario</span>
    </a>
    <a href="revision.html" class="sidebar-link">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16"/><rect x="6" y="11" width="3" height="8"/><rect x="11" y="7" width="3" height="12"/><rect x="16" y="13" width="3" height="6"/></svg></span>
      <span data-i18n="sidebar.revision">Revisión anual</span>
    </a>
    <button type="button" class="sidebar-link theme-toggle-btn">
      <span class="sidebar-icon"><span class="theme-toggle-icon">🌙</span></span>
      <span data-i18n="sidebar.modoOscuro">Modo oscuro</span>
    </button>
    <button type="button" class="sidebar-link logout-trigger sidebar-logout">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4H6a2 2 0 00-2 2v12a2 2 0 002 2h3"/><path d="M15 8l4 4-4 4"/><line x1="19" y1="12" x2="9" y2="12"/></svg></span>
      <span data-i18n="sidebar.cerrarSesion">Cerrar sesión</span>
    </button>
  </nav>

  <div class="app-shell">
  <div class="topbar">
    <h1 class="logo">LingScout</h1>
    <div class="topbar-actions">
      <select class="lang-selector topbar-lang-selector" data-i18n-title="sidebar.idioma" title="Idioma" aria-label="Idioma">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="de">Deutsch</option>
        <option value="pt">Português</option>
        <option value="nl">Nederlands</option>
        <option value="sv">Svenska</option>
        <option value="no">Norsk</option>
        <option value="da">Dansk</option>
        <option value="pl">Polski</option>
        <option value="ru">Русский</option>
        <option value="af">Afrikaans</option>
        <option value="ja">日本語</option>
        <option value="zh">中文（简体）</option>
        <option value="ko">한국어</option>
        <option value="uk">Українська</option>
        <option value="ary">الدارجة المغربية</option>
        <option value="ar">العربية</option>
      </select>
      <button type="button" class="btn-secondary theme-toggle-btn topbar-theme-btn" data-i18n-title="sidebar.modoOscuro" title="Modo oscuro" aria-label="Modo oscuro"><span class="theme-toggle-icon">🌙</span></button>
      <a href="app.html" class="btn-secondary" data-i18n="topbar.volver">← Volver</a>
      <button class="btn-secondary logout-trigger" id="logout-btn" data-i18n="sidebar.cerrarSesion">Cerrar sesión</button>
    </div>
  </div>

  <main class="form-page">
    <div class="accent-bar accent-bar-jugador"></div>
    <h2 data-i18n="jf.titleNew">Nuevo análisis de jugador</h2>
    <form id="jugador-form">

      <section class="form-section">
        <h3 data-i18n="pf.sectionGeneral">Datos generales</h3>
        <label data-i18n="jf.jugador">Jugador</label>
        <input type="text" id="jugador-nombre" list="jugadores-list" required placeholder="Pedri">

        <div class="grid-2">
          <div>
            <label data-i18n="jf.equipo">Equipo</label>
            <input type="text" id="equipo" required placeholder="Barcelona">
          </div>
          <div>
            <label data-i18n="pf.competicion">Competición</label>
            <input type="text" id="competicion" list="competiciones-list" required placeholder="La Liga">
            <datalist id="competiciones-list">
              <option value="La Liga">
              <option value="Champions League">
              <option value="Europa League">
              <option value="Premier League">
              <option value="Serie A">
              <option value="Bundesliga">
              <option value="Copa del Rey">
            </datalist>
          </div>
        </div>
        <label data-i18n="pf.temporada">Temporada</label>
        <input type="text" id="temporada" required placeholder="2025/2026">
      </section>

      <section class="form-section">
        <h3 data-i18n="jf.sectionRendimiento">Rendimiento</h3>
        <div class="grid-2">
          <div>
            <label data-i18n="jf.goles">Goles</label>
            <input type="number" id="goles" min="0" value="0" required>
          </div>
          <div>
            <label data-i18n="jf.asistencias">Asistencias</label>
            <input type="number" id="asistencias" min="0" value="0" required>
          </div>
        </div>
        <label data-i18n="jf.nota">Nota (1-10)</label>
        <input type="number" id="nota" min="1" max="10" required placeholder="8">
        <label for="resistencia" data-i18n="jf.resistencia">Resistencia</label>
        <select id="resistencia">
          <option value="" data-i18n="jf.resElegir">Seleccionar</option>
          <option value="termina" data-i18n="jf.resTermina">Termina partido</option>
          <option value="buena" data-i18n="jf.resBuena">Buena</option>
          <option value="media" data-i18n="jf.resMedia">Media</option>
          <option value="mala" data-i18n="jf.resMala">Mala</option>
        </select>
        <label for="pie-dominante" data-i18n="jf.pie">Pie dominante</label>
        <select id="pie-dominante">
          <option value="" data-i18n="jf.resElegir">Seleccionar</option>
          <option value="derecho" data-i18n="jf.pieDer">Derecho</option>
          <option value="izquierdo" data-i18n="jf.pieIzq">Izquierdo</option>
          <option value="ambidiestro" data-i18n="jf.pieAmbos">Ambidiestro</option>
        </select>
        <label for="potencial" data-i18n="jf.potencial">Potencial</label>
        <select id="potencial">
          <option value="" data-i18n="jf.resElegir">Seleccionar</option>
          <option value="top_mundial" data-i18n="jf.potTopMundial">División/equipo top mundial</option>
          <option value="top_pais" data-i18n="jf.potTopPais">División/equipo top de su país</option>
          <option value="superior" data-i18n="jf.potSuperior">División/equipo superior al actual</option>
          <option value="poco_superior" data-i18n="jf.potPocoSuperior">Un poco superior</option>
          <option value="igual" data-i18n="jf.potIgual">Se queda como está</option>
          <option value="no_llega" data-i18n="jf.potNoLlega">No llega a más</option>
          <option value="liga_inferior" data-i18n="jf.potInferior">Debería estar en una liga más baja</option>
          <option value="veterano" data-i18n="jf.potVeterano">Veterano</option>
        </select>
        <label data-i18n="jf.impresiones">Impresiones</label>
        <textarea id="impresiones" rows="4" placeholder="Cómo ha jugado, qué ha destacado..." data-i18n-placeholder="jf.impresionesPh"></textarea>
      </section>

      <section class="form-section">
        <h3><span data-i18n="jf.sectionPosicion">Posición media</span> <span class="opcional-tag" data-i18n="pf.opcional">(opcional)</span></h3>
        <div class="lineup-row">
          <button type="button" class="btn-position" id="btn-posicion-media" data-i18n="jf.marcarPosicion">📍 Marcar posición</button>
          <span class="position-badge" id="posicion-badge" hidden data-i18n="jf.guardada">✓ Guardada</span>
        </div>
      </section>

      <section class="form-section">
        <h3><span data-i18n="pf.sectionOtros">Otros detalles</span> <span class="opcional-tag" data-i18n="pf.opcional">(opcional)</span></h3>
        <div class="grid-2">
          <div>
            <label data-i18n="pf.minuto">Minuto</label>
            <input type="number" id="minuto" min="0" max="130" placeholder="60">
          </div>
          <div>
            <label data-i18n="pf.etiquetas">Etiquetas (separadas por coma)</label>
            <input type="text" id="etiquetas" placeholder="lesión, sustitución">
          </div>
        </div>
        <label data-i18n="pf.dibujo">Dibujo de una jugada</label>
        <div class="drawing-toolbar">
          <div class="toolbar-row">
            <button type="button" class="tool-btn perspective-btn active" data-perspective="vertical" data-i18n="pf.campoCompleto">Campo completo</button>
            <button type="button" class="tool-btn perspective-btn" data-perspective="half" data-i18n="pf.medioCampo">Medio campo</button>
            <button type="button" class="tool-btn perspective-btn" data-perspective="horizontal" data-i18n="pf.horizontal">Horizontal</button>
          </div>
          <div class="toolbar-row">
            <button type="button" class="tool-btn mode-btn active" data-mode="draw" data-i18n="pf.lapiz">✏️ Lápiz</button>
            <button type="button" class="tool-btn mode-btn" data-mode="own" data-i18n="pf.propio">⬤ Propio</button>
            <button type="button" class="tool-btn mode-btn" data-mode="rival" data-i18n="pf.rival">◯ Rival</button>
            <button type="button" class="tool-btn mode-btn" data-mode="ball" data-i18n="pf.balon">⚽ Balón</button>
            <button type="button" class="tool-btn mode-btn" data-mode="erase" data-i18n="pf.quitar">🗑️ Quitar</button>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="drawing-canvas"></canvas>
          <button type="button" class="btn-secondary" id="clear-canvas" data-i18n="pf.borrarTodo">Borrar todo</button>
        </div>
      </section>

      <button type="submit" class="btn-primary btn-submit btn-accent-jugador" data-i18n="pf.guardar">Guardar análisis</button>
      <p class="form-message" id="form-message"></p>
    </form>
  </main>
  </div>
</div>

<datalist id="jugadores-list"></datalist>

<!-- Modal de posición media -->
<div class="modal-overlay" id="position-modal" hidden>
  <div class="modal-card">
    <h3 data-i18n="pf.posicionMedia">Posición media</h3>
    <p class="modal-player-name" id="modal-player-name"></p>
    <svg id="pitch-svg" viewBox="0 0 300 450" class="pitch">
      <rect x="2" y="2" width="296" height="446" fill="#F5F1EB" stroke="#111111" stroke-width="2"/>
      <line x1="2" y1="225" x2="298" y2="225" stroke="#111111" stroke-width="2"/>
      <circle cx="150" cy="225" r="45" fill="none" stroke="#111111" stroke-width="2"/>
      <rect x="70" y="2" width="160" height="60" fill="none" stroke="#111111" stroke-width="2"/>
      <rect x="70" y="388" width="160" height="60" fill="none" stroke="#111111" stroke-width="2"/>
      <circle id="pitch-marker" cx="-10" cy="-10" r="7" fill="#111111"/>
    </svg>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="modal-cancel" data-i18n="pf.cancelar">Cancelar</button>
      <button type="button" class="btn-primary" id="modal-save" data-i18n="pf.guardarPosicion">Guardar posición</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseConfig.js"></script>
<script src="js/drawingTool.js"></script>
<script src="js/jugadorForm.js"></script>
<script src="js/theme.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
