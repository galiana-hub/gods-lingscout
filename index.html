<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God's LingScout — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1 class="logo">God's <span>LingScout</span></h1>
    <p class="tagline">Tu cuaderno de análisis de fútbol</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Iniciar sesión</button>
      <button class="tab-btn" data-tab="register">Crear cuenta</button>
    </div>

    <form id="login-form" class="auth-form active">
      <label>Email</label>
      <input type="email" id="login-email" required placeholder="tú@email.com">
      <label>Contraseña</label>
      <input type="password" id="login-password" required placeholder="••••••••">
      <button type="submit" class="btn-primary">Entrar</button>
      <p class="form-message" id="login-message"></p>
    </form>

    <form id="register-form" class="auth-form">
      <label>Email</label>
      <input type="email" id="register-email" required placeholder="tú@email.com">
      <label>Contraseña</label>
      <input type="password" id="register-password" required placeholder="Mínimo 6 caracteres" minlength="6">
      <button type="submit" class="btn-primary">Crear cuenta</button>
      <p class="form-message" id="register-message"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseConfig.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
