<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo análisis de partido — God's LingScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <h1 class="logo">God's <span>LingScout</span></h1>
    <div class="topbar-actions">
      <a href="app.html" class="btn-secondary">← Volver</a>
      <button class="btn-secondary" id="logout-btn">Cerrar sesión</button>
    </div>
  </div>

  <main class="form-page">
    <h2>Nuevo análisis de partido</h2>
    <form id="partido-form">

      <!-- Datos generales -->
      <section class="form-section">
        <h3>Datos generales</h3>
        <div class="grid-2">
          <div>
            <label>Competición</label>
            <input type="text" id="competicion" list="competiciones-list" required placeholder="La Liga, Champions...">
            <datalist id="competiciones-list">
              <option value="La Liga">
              <option value="Champions League">
              <option value="Europa League">
              <option value="Premier League">
              <option value="Serie A">
              <option value="Bundesliga">
              <option value="Copa del Rey">
            </datalist>
          </div>
          <div>
            <label>Temporada</label>
            <input type="text" id="temporada" required placeholder="2025/2026">
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label>Equipo local</label>
            <input type="text" id="equipo-local" required placeholder="Real Madrid">
          </div>
          <div>
            <label>Equipo visitante</label>
            <input type="text" id="equipo-visitante" required placeholder="Inter Milan">
          </div>
        </div>
      </section>

      <!-- Resultado -->
      <section class="form-section">
        <h3>Resultado</h3>
        <div class="score-row">
          <input type="number" id="goles-local" min="0" required class="score-input">
          <span class="score-sep">—</span>
          <input type="number" id="goles-visitante" min="0" required class="score-input">
        </div>
        <div class="grid-2">
          <div>
            <label>1ª parte (ej. 1-0)</label>
            <input type="text" id="marcador-1p" placeholder="1-0">
          </div>
          <div>
            <label>2ª parte (ej. 1-1)</label>
            <input type="text" id="marcador-2p" placeholder="1-1">
          </div>
        </div>
      </section>

      <!-- Posesión -->
      <section class="form-section">
        <h3>Posesión</h3>
        <div class="radio-row">
          <label class="radio-option">
            <input type="radio" name="posesion" value="local">
            <span id="posesion-label-local">Local</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="posesion" value="visitante">
            <span id="posesion-label-visitante">Visitante</span>
          </label>
        </div>
      </section>

      <!-- Sistemas tácticos -->
      <section class="form-section">
        <h3>Sistema táctico</h3>
        <div class="grid-2">
          <div>
            <p class="subheading" id="sistema-local-heading">Local</p>
            <label>Con balón</label>
            <input type="text" id="sistema-local-con" placeholder="4-3-3">
            <label>Sin balón</label>
            <input type="text" id="sistema-local-sin" placeholder="4-4-2">
          </div>
          <div>
            <p class="subheading" id="sistema-visitante-heading">Visitante</p>
            <label>Con balón</label>
            <input type="text" id="sistema-visitante-con" placeholder="4-2-3-1">
            <label>Sin balón</label>
            <input type="text" id="sistema-visitante-sin" placeholder="4-5-1">
          </div>
        </div>
      </section>

      <!-- Jugadores clave -->
      <section class="form-section">
        <h3>Jugador clave</h3>
        <div class="grid-2">
          <div>
            <label id="clave-local-heading">Local</label>
            <input type="text" id="clave-local" list="jugadores-list">
          </div>
          <div>
            <label id="clave-visitante-heading">Visitante</label>
            <input type="text" id="clave-visitante" list="jugadores-list">
          </div>
        </div>
      </section>

      <!-- Alineación -->
      <section class="form-section">
        <h3>Alineación</h3>
        <div class="grid-2">
          <div>
            <p class="subheading" id="alineacion-local-heading">Local</p>
            <div class="lineup-list" id="lineup-local"></div>
            <button type="button" class="btn-link" data-team="local">+ Añadir cambio</button>
          </div>
          <div>
            <p class="subheading" id="alineacion-visitante-heading">Visitante</p>
            <div class="lineup-list" id="lineup-visitante"></div>
            <button type="button" class="btn-link" data-team="visitante">+ Añadir cambio</button>
          </div>
        </div>
      </section>

      <!-- Opcionales -->
      <section class="form-section">
        <h3>Otros detalles <span class="opcional-tag">(opcional)</span></h3>
        <label>Cambio táctico del entrenador</label>
        <textarea id="cambio-tactico" rows="2" placeholder="Ej: Inzaghi pasó a defensa de 5 en el minuto 60"></textarea>

        <div class="grid-2">
          <div>
            <label>Minuto</label>
            <input type="number" id="minuto" min="0" max="130" placeholder="60">
          </div>
          <div>
            <label>Etiquetas (separadas por coma)</label>
            <input type="text" id="etiquetas" placeholder="arbitraje, polémica">
          </div>
        </div>

        <label>Dibujo de una jugada</label>
        <div class="canvas-wrap">
          <canvas id="drawing-canvas" width="300" height="200"></canvas>
          <button type="button" class="btn-secondary" id="clear-canvas">Borrar dibujo</button>
        </div>
      </section>

      <button type="submit" class="btn-primary btn-submit">Guardar análisis</button>
      <p class="form-message" id="form-message"></p>
    </form>
  </main>
</div>

<datalist id="jugadores-list"></datalist>

<!-- Modal de posición media -->
<div class="modal-overlay" id="position-modal" hidden>
  <div class="modal-card">
    <h3>Posición media</h3>
    <p class="modal-player-name" id="modal-player-name"></p>
    <svg id="pitch-svg" viewBox="0 0 300 450" class="pitch">
      <rect x="2" y="2" width="296" height="446" fill="#F5F1EB" stroke="#111111" stroke-width="2"/>
      <line x1="2" y1="225" x2="298" y2="225" stroke="#111111" stroke-width="2"/>
      <circle cx="150" cy="225" r="45" fill="none" stroke="#111111" stroke-width="2"/>
      <rect x="70" y="2" width="160" height="60" fill="none" stroke="#111111" stroke-width="2"/>
      <rect x="70" y="388" width="160" height="60" fill="none" stroke="#111111" stroke-width="2"/>
      <circle id="pitch-marker" cx="-10" cy="-10" r="7" fill="#111111"/>
    </svg>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="modal-cancel">Cancelar</button>
      <button type="button" class="btn-primary" id="modal-save">Guardar posición</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseConfig.js"></script>
<script src="js/partidoForm.js"></script>
</body>
</html>
