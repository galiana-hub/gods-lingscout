<!DOCTYPE html>
<html lang="es">
<head>
<script>try{if(localStorage.getItem("lingscout-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo análisis de partido — LingScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LingScout">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <p class="sidebar-logo">LingScout</p>
    <a href="app.html" class="sidebar-link">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9h5v-5h2v5h5v-9"/></svg></span>
      <span>Inicio</span>
    </a>
    <a href="partido.html" class="sidebar-link active">
      <span class="sidebar-icon accent-partido-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg></span>
      <span>Nuevo Partido</span>
    </a>
    <a href="jugador.html" class="sidebar-link">
      <span class="sidebar-icon accent-jugador-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-4 4-6 7-6s5.5 2 7 6"/></svg></span>
      <span>Nuevo Jugador</span>
    </a>
    <a href="partidos.html" class="sidebar-link">
      <span class="sidebar-icon accent-partidos-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="17" x2="19" y2="17"/></svg></span>
      <span>Mis Partidos</span>
    </a>
    <a href="jugadores.html" class="sidebar-link">
      <span class="sidebar-icon accent-jugadores-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M3.5 19c1-3.2 3-5 5.5-5s4.5 1.8 5.5 5"/><path d="M14 14.3c2 .2 3.6 1.8 4.5 4.7"/></svg></span>
      <span>Mis Jugadores</span>
    </a>
    <button type="button" class="sidebar-link theme-toggle-btn">
      <span class="sidebar-icon"><span class="theme-toggle-icon">🌙</span></span>
      <span>Modo oscuro</span>
    </button>
    <button type="button" class="sidebar-link logout-trigger sidebar-logout">
      <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4H6a2 2 0 00-2 2v12a2 2 0 002 2h3"/><path d="M15 8l4 4-4 4"/><line x1="19" y1="12" x2="9" y2="12"/></svg></span>
      <span>Cerrar sesión</span>
    </button>
  </nav>

  <div class="app-shell">
  <div class="topbar">
    <h1 class="logo">LingScout</h1>
    <div class="topbar-actions">
      <a href="app.html" class="btn-secondary">← Volver</a>
      <button class="btn-secondary logout-trigger" id="logout-btn">Cerrar sesión</button>
    </div>
  </div>

  <main class="form-page">
    <div class="accent-bar accent-bar-partido"></div>
    <h2>Nuevo análisis de partido</h2>
    <form id="partido-form">

      <!-- Datos generales -->
      <section class="form-section">
        <h3>Datos generales</h3>
        <div class="grid-2">
          <div>
            <label>Competición</label>
            <input type="text" id="competicion" list="competiciones-list" required placeholder="La Liga, Champions...">
            <datalist id="competiciones-list">
              <option value="La Liga">
              <option value="Champions League">
              <option value="Europa League">
              <option value="Premier League">
              <option value="Serie A">
              <option value="Bundesliga">
              <option value="Copa del Rey">
            </datalist>
          </div>
          <div>
            <label>Temporada</label>
            <input type="text" id="temporada" required placeholder="2025/2026">
            <label>Tipo <span class="opcional-tag">(opcional)</span></label>
            <select id="tipo-eliminatoria">
              <option value="">Partido único</option>
              <option value="ida">Ida</option>
              <option value="vuelta">Vuelta</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label>Equipo local</label>
            <input type="text" id="equipo-local" required placeholder="Real Madrid">
          </div>
          <div>
            <label>Equipo visitante</label>
            <input type="text" id="equipo-visitante" required placeholder="Inter Milan">
          </div>
        </div>
      </section>

      <!-- Resultado -->
      <section class="form-section">
        <h3>Resultado</h3>
        <div class="score-row">
          <input type="number" id="goles-local" min="0" required class="score-input">
          <span class="score-sep">—</span>
          <input type="number" id="goles-visitante" min="0" required class="score-input">
        </div>
        <div class="grid-2">
          <div>
            <label>1ª parte (ej. 1-0)</label>
            <input type="text" id="marcador-1p" placeholder="1-0">
          </div>
          <div>
            <label>2ª parte (ej. 1-1)</label>
            <input type="text" id="marcador-2p" placeholder="1-1">
          </div>
        </div>
      </section>

      <!-- Posesión -->
      <section class="form-section">
        <h3>Posesión</h3>
        <div class="radio-row">
          <label class="radio-option">
            <input type="radio" name="posesion" value="local">
            <span id="posesion-label-local">Local</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="posesion" value="visitante">
            <span id="posesion-label-visitante">Visitante</span>
          </label>
        </div>
      </section>

      <!-- Sistemas tácticos -->
      <section class="form-section">
        <h3>Sistema táctico</h3>
        <div class="grid-2">
          <div>
            <p class="subheading" id="sistema-local-heading">Local</p>
            <label>Con balón</label>
            <input type="text" id="sistema-local-con" placeholder="4-3-3">
            <label>Sin balón</label>
            <input type="text" id="sistema-local-sin" placeholder="4-4-2">
          </div>
          <div>
            <p class="subheading" id="sistema-visitante-heading">Visitante</p>
            <label>Con balón</label>
            <input type="text" id="sistema-visitante-con" placeholder="4-2-3-1">
            <label>Sin balón</label>
            <input type="text" id="sistema-visitante-sin" placeholder="4-5-1">
          </div>
        </div>
      </section>

      <!-- Jugadores clave -->
      <section class="form-section">
        <h3>Jugador clave</h3>
        <div class="grid-2">
          <div>
            <label id="clave-local-heading">Local</label>
            <input type="text" id="clave-local" list="jugadores-list">
          </div>
          <div>
            <label id="clave-visitante-heading">Visitante</label>
            <input type="text" id="clave-visitante" list="jugadores-list">
          </div>
        </div>
      </section>

      <!-- Alineación -->
      <section class="form-section">
        <h3>Alineación</h3>
        <div class="grid-2">
          <div>
            <p class="subheading" id="alineacion-local-heading">Local</p>
            <div class="lineup-list" id="lineup-local"></div>
            <button type="button" class="btn-link" data-team="local">+ Añadir cambio</button>
          </div>
          <div>
            <p class="subheading" id="alineacion-visitante-heading">Visitante</p>
            <div class="lineup-list" id="lineup-visitante"></div>
            <button type="button" class="btn-link" data-team="visitante">+ Añadir cambio</button>
          </div>
        </div>
      </section>

      <!-- Opcionales -->
      <section class="form-section">
        <h3>Otros detalles <span class="opcional-tag">(opcional)</span></h3>
        <label>Cambio táctico del entrenador</label>
        <textarea id="cambio-tactico" rows="2" placeholder="Ej: Inzaghi pasó a defensa de 5 en el minuto 60"></textarea>

        <div class="grid-2">
          <div>
            <label>Minuto</label>
            <input type="number" id="minuto" min="0" max="130" placeholder="60">
          </div>
          <div>
            <label>Etiquetas (separadas por coma)</label>
            <input type="text" id="etiquetas" placeholder="arbitraje, polémica">
          </div>
        </div>

        <label>Dibujo de una jugada</label>
        <div class="drawing-toolbar">
          <div class="toolbar-row">
            <button type="button" class="tool-btn perspective-btn active" data-perspective="vertical">Campo completo</button>
            <button type="button" class="tool-btn perspective-btn" data-perspective="half">Medio campo</button>
            <button type="button" class="tool-btn perspective-btn" data-perspective="horizontal">Horizontal</button>
          </div>
          <div class="toolbar-row">
            <button type="button" class="tool-btn mode-btn active" data-mode="draw">✏️ Lápiz</button>
            <button type="button" class="tool-btn mode-btn" data-mode="own">⬤ Propio</button>
            <button type="button" class="tool-btn mode-btn" data-mode="rival">◯ Rival</button>
            <button type="button" class="tool-btn mode-btn" data-mode="ball">⚽ Balón</button>
            <button type="button" class="tool-btn mode-btn" data-mode="erase">🗑️ Quitar</button>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="drawing-canvas"></canvas>
          <button type="button" class="btn-secondary" id="clear-canvas">Borrar todo</button>
        </div>
      </section>

      <button type="submit" class="btn-primary btn-submit btn-accent-partido">Guardar análisis</button>
      <p class="form-message" id="form-message"></p>
    </form>
  </main>
  </div>
</div>

<datalist id="jugadores-list"></datalist>

<!-- Modal de posición media -->
<div class="modal-overlay" id="position-modal" hidden>
  <div class="modal-card">
    <h3>Posición media</h3>
    <p class="modal-player-name" id="modal-player-name"></p>
    <svg id="pitch-svg" viewBox="0 0 300 450" class="pitch">
      <rect x="2" y="2" width="296" height="446" fill="#F5F1EB" stroke="#111111" stroke-width="2"/>
      <line x1="2" y1="225" x2="298" y2="225" stroke="#111111" stroke-width="2"/>
      <circle cx="150" cy="225" r="45" fill="none" stroke="#111111" stroke-width="2"/>
      <rect x="70" y="2" width="160" height="60" fill="none" stroke="#111111" stroke-width="2"/>
      <rect x="70" y="388" width="160" height="60" fill="none" stroke="#111111" stroke-width="2"/>
      <circle id="pitch-marker" cx="-10" cy="-10" r="7" fill="#111111"/>
    </svg>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="modal-cancel">Cancelar</button>
      <button type="button" class="btn-primary" id="modal-save">Guardar posición</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseConfig.js"></script>
<script src="js/drawingTool.js"></script>
<script src="js/partidoForm.js"></script>
<script src="js/theme.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
